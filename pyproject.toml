[project]
name = "agents-memory"
version = "0.1.0"
description = "Agent memory experiments: vector stores, retrieval strategies, memory architectures"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "jupyterlab>=4.0.0",
    "nbformat>=5.0.0",
]
training = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "peft>=0.18.1",
    "transformers>=5.0.0",
    "trl>=0.27.2",
    "bitsandbytes>=0.46.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_memory"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
